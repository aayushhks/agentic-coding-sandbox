name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # the fleet tests run against this service, and fail rather than skip without it
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fleet_test
      REQUIRE_POSTGRES: "1"
      # the sandbox's namespace tests fail rather than skip when the runner can't isolate
      REQUIRE_SANDBOX_ISOLATION: "1"
      # and the container tests fail rather than skip without docker and the task image
      REQUIRE_DOCKER: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: install python 3.13
        run: uv python install 3.13

      - name: install dependencies
        run: uv sync

      - name: allow unprivileged user namespaces (ubuntu 24.04 restricts them through apparmor)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --net --mount --pid --fork true && echo "namespaces available"

      - name: build the task image every fleet task runs in
        run: ../scripts/build-task-image.sh

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest --ignore=tests/test_fleet_stress.py

      - name: fleet stress (8 workers on 1 s leases, killed and paused at random, invariants checked)
        run: uv run pytest tests/test_fleet_stress.py -s

      - name: mcp eval smoke (one benchmark task, mock provider, mcp transport)
        env:
          LLM_PROVIDER: mock
          TOOL_TRANSPORT: mcp
          DATABASE_URL: "sqlite+aiosqlite:///mcp-smoke.db"
        run: uv run python -m app.eval.cli --label ci-mcp-smoke --create-tables --limit 1

      - name: bench replay (every recorded task, two trials, fails on divergence)
        run: uv run python -m bench.cli replay --label ci-replay --trials 2 --out "$RUNNER_TEMP/bench-ci"

  chaos:
    # every fault scenario on every push, each seed its own job; a run fails on any invariant
    # violation, any fault that didn't leave its effects behind, or any fault that never happened
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: install python 3.13
        run: uv python install 3.13

      - name: install dependencies
        run: uv sync

      - name: allow unprivileged user namespaces (the agent scenarios run its sandbox)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: build the task image the container scenarios run in
        run: ../scripts/build-task-image.sh

      - name: chaos (every scenario at seed ${{ matrix.seed }}, on a local postgres it can restart)
        run: uv run python -m chaos run --scenarios all --seeds ${{ matrix.seed }} --out "$RUNNER_TEMP/chaos"

      - name: keep the run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-seed-${{ matrix.seed }}
          path: ${{ runner.temp }}/chaos

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build
